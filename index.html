<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SYSTEM</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Consolas,monospace;color:#0f0}
canvas{position:fixed;inset:0}

<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;
const f=16;let d=Array(Math.ceil(innerWidth/f)).fill(1);
setInterval(()=>{x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#0a0';x.font=f+'px monospace';
d.forEach((y,i)=>{x.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*f,y*f);if(y*f>c.height&&Math.random()>.975)d[i]=0;d[i]++})},40);
